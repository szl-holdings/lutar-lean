# Release-blocking CRITICAL gate for the szl-holdings estate.
#
# Rule (validated on the live org): a line matching
#     (?<!-)a11oy\.com
# is a violation UNLESS the same line is a prohibition/guard context, i.e. it
# also matches /(never|forbidden|not in|assertNotIn|does not appear|is not a
# surface|blocklist)/i — guard assertions, blocklists, and doctrine notes are
# legitimate. Canonical surfaces are a-11-oy.com (product) and a11oy.net
# (proof).
#
# Installed by the szl-alignment engine; keep in sync with
# alignment/templates/workflows/forbidden-domain.yml.
name: forbidden-domain

on:
  pull_request: null
  merge_group:
    types:
    - checks_requested
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GNU grep, not ripgrep: rg is not installed on ubuntu-latest, and the old
      # `rg ... || true` turned "command not found" into "no hits", so this gate
      # passed without scanning anything. grep exits 0 (match), 1 (no match) or
      # >1 (error); only 1 means clean, an error fails the gate.
      - name: Scan for forbidden domain references
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          hits="$(grep -rnIP --exclude-dir=.git '(?<!-)a11oy\.com' .)" || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::forbidden-domain scan could not run (grep exit $rc)."
            exit "$rc"
          fi
          violations=""
          if [ -n "$hits" ]; then
            rc=0
            violations="$(printf '%s\n' "$hits" | grep -v -i -E 'never|forbidden|not in|assertNotIn|does not appear|is not a surface|blocklist')" || rc=$?
            if [ "$rc" -gt 1 ]; then
              echo "::error::forbidden-domain guard-context filter could not run (grep exit $rc)."
              exit "$rc"
            fi
          fi
          if [ -n "$violations" ]; then
            echo "::error::Forbidden domain references found (release-blocking CRITICAL)."
            echo "::error::Replace with a-11-oy.com or remove; guard contexts must say so on the same line."
            printf '%s\n' "$violations"
            exit 1
          fi
          echo "OK: no forbidden domain references outside guard contexts."
