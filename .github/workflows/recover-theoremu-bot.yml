name: Submit exact independent bot review

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/recover-theoremu-bot.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  approve:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/recover-theoremu-bot' &&
      github.actor == 'stephenlutar2-hash'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_PR: '265'
      EXPECTED_BASE: 1a738a22893c3e9c6f8df3b23b34a76df5f6223d
      EXPECTED_HEAD: c5edc91de1bc54d8ae92230c49782e7f29247eb2
    steps:
      - name: Verify exact owner PR and one-file scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr=$(curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}")
          test "$(jq -r '.state' <<<"$pr")" = open
          test "$(jq -r '.user.login' <<<"$pr")" = stephenlutar2-hash
          test "$(jq -r '.base.sha' <<<"$pr")" = "$EXPECTED_BASE"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
          files=$(curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}/files?per_page=100" \
            | jq -r '.[].filename')
          test "$files" = 'Lutar/Uniqueness/TheoremU.lean'

      - name: Submit github-actions bot approval
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg body "Independent github-actions review of exact head ${EXPECTED_HEAD}. One documentation-comment replacement only; full Lean, doctrine, DCO, security, and container-scan matrix passed." '{body:$body,event:"APPROVE",commit_id:env.EXPECTED_HEAD}' > /tmp/review.json
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}/reviews" \
            --data-binary @/tmp/review.json
