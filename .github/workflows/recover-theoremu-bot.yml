name: Audit configured reviewer credential names

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/recover-theoremu-bot.yml

permissions:
  contents: write

jobs:
  audit-secret-names:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/recover-theoremu-bot' &&
      github.actor == 'stephenlutar2-hash'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current main without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: source
          persist-credentials: false
          show-progress: false

      - name: Checkout control branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ops/recover-theoremu-bot
          path: control
          fetch-depth: 0
          show-progress: false

      - name: Record referenced secret names only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/diagnostics
          {
            echo '# Secret names referenced by tracked workflows'
            echo '# Values were not read or exposed.'
            grep -rhoE '\$\{\{[[:space:]]*secrets\.[A-Za-z0-9_]+' source/.github/workflows \
              | sed -E 's/.*secrets\.//' \
              | sort -u
          } > control/diagnostics/workflow-secret-names.txt
          test -s control/diagnostics/workflow-secret-names.txt

      - name: Commit audit result to control branch
        working-directory: control
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- diagnostics/workflow-secret-names.txt)" ]]; then
            echo 'Audit result unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/workflow-secret-names.txt
          git commit -m 'docs(ci): record workflow secret names' -m 'No secret values were read or exposed.' -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          git push origin HEAD:ops/recover-theoremu-bot
