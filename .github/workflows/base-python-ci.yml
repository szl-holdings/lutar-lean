# Standard Python gate for the szl-holdings estate: ruff + pytest on the two
# supported interpreters. Installed by the szl-alignment engine (only into
# repos where Python is detected); keep in sync with
# alignment/templates/workflows/base-python-ci.yml.
name: base-python-ci

on:
  pull_request: null
  push:
    branches:
    - main
    - master
  merge_group:
    types:
    - checks_requested
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Org policy: every action is pinned to a full-length commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # lutar-lean is a Lean library, not a Python package (no pyproject.toml or
      # requirements.txt): its Python is CI tooling and tests that need only the
      # standard library. So the gate installs just its two tools, hash-locked
      # for both interpreters in requirements/ci/base-python-ci.txt.
      - name: Install toolchain (hash-locked)
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/ci/base-python-ci.txt

      # Blocking scope is the classes that indicate real breakage (syntax
      # errors, undefined names, unused imports). The full default ruleset runs
      # non-blocking so repos keep visibility without a forced flag day; repos
      # with their own ruff config in pyproject.toml already get stricter
      # behavior from their primary CI.
      - name: "Ruff (blocking: E9/F)"
        run: ruff check . --output-format github --select E9,F

      - name: "Ruff (full ruleset, informational)"
        run: ruff check . --statistics --exit-zero

      - name: Pytest (blocking)
        run: pytest -q
