name: Bounty Board

on:
  push:
    branches:
    - main
    paths:
    - bounties/**
    - scripts/check_bounties.py
    - .github/workflows/bounties.yml
  pull_request:
    branches:
    - main
    paths:
    - bounties/**
    - scripts/check_bounties.py
    - .github/workflows/bounties.yml
  workflow_dispatch: null
  merge_group:
    types:
    - checks_requested
    branches:
    - main
permissions:
  contents: read

jobs:
  lint:
    name: Validate bounty board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install --no-cache-dir pyyaml
      - name: Check bounty board schema + honesty
        run: python3 scripts/check_bounties.py
