name: Bounty Board

on:
  push:
    branches: [main]
    paths:
      - "bounties/**"
      - "scripts/check_bounties.py"
      - ".github/workflows/bounties.yml"
  pull_request:
    branches: [main]
    paths:
      - "bounties/**"
      - "scripts/check_bounties.py"
      - ".github/workflows/bounties.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Validate bounty board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install --no-cache-dir pyyaml
      - name: Check bounty board schema + honesty
        run: python3 scripts/check_bounties.py
