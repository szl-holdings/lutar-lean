name: Bounty Board

on:
  push:
    branches: [main]
    paths:
      - "bounties/**"
      - "scripts/check_bounties.py"
      - ".github/workflows/bounties.yml"
  pull_request:
    branches: [main]
    paths:
      - "bounties/**"
      - "scripts/check_bounties.py"
      - ".github/workflows/bounties.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Validate bounty board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install --no-cache-dir pyyaml
      - name: Check bounty board schema + honesty
        run: python3 scripts/check_bounties.py
