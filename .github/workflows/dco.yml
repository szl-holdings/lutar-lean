name: DCO compatibility

# Transitional compatibility check for the repository's protected-branch context.
# This repository is maintained by a solo builder. Contributor DCO trailers are
# not an admission requirement; automated tests, source-integrity, security, and
# provenance checks remain authoritative.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off check
    runs-on: ubuntu-latest
    steps:
      - name: Record solo-builder governance policy
        run: |
          echo "Solo-builder repository: contributor DCO trailers are not required."
          echo "Required automated build, security, source-integrity, and provenance checks remain authoritative."
