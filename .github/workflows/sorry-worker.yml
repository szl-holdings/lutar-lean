name: sorry-worker

on:
  workflow_dispatch:
    inputs:
      file:
        description: "Specific .lean file (blank = N shortest sorry files)"
        required: false
        default: ""
      max:
        description: "How many files to attempt when no file given"
        required: false
        default: "1"
      model:
        description: "Groq model id (current production default: openai/gpt-oss-120b)"
        required: false
        default: "openai/gpt-oss-120b"

# Least privilege: read-only by default; the propose job needs contents:write
# to push an UNVERIFIED proposals branch (never auto-merged). (Scorecard Token-Permissions)
permissions: read-all
jobs:
  propose:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push proposals/* branch (no auto-merge)
    # Groq OpenAI-compatible endpoint (publicly reachable from CI).
    # Billing and quotas follow the configured Groq account; swap the endpoint/key to use another provider.
    env:
      LLM_PROVIDER: openai
      LLM_BASE_URL: https://api.groq.com/openai/v1
      LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Propose candidate proofs (UNVERIFIED, Groq provider)
        env:
          IN_FILE: ${{ inputs.file }}
          IN_MAX: ${{ inputs.max }}
          IN_MODEL: ${{ inputs.model }}
        run: |
          if [ -n "$IN_FILE" ]; then
            python3 propose_proof.py --file "$IN_FILE" --model "$IN_MODEL"
          else
            python3 propose_proof.py --max "$IN_MAX" --model "$IN_MODEL"
          fi
      - name: Push proposals branch (no auto-merge)
        if: always()
        run: |
          if [ -d proposals ] && [ -n "$(ls -A proposals 2>/dev/null)" ]; then
            br="forge/sorry-proposals-${{ github.run_id }}"
            git config user.name "sorry-worker"
            git config user.email "actions@github.com"
            git checkout -b "$br"
            git add proposals
            git commit -m "chore(sorry-worker): UNVERIFIED candidate proofs (run ${{ github.run_id }})"
            git push origin "$br"
            {
              echo "### sorry-worker proposals (UNVERIFIED — PhD review + lake build required)"
              echo ""
              cat proposals/INDEX.md
              echo ""
              echo "Branch \`$br\` — open a PR: ${{ github.server_url }}/${{ github.repository }}/compare/main...$br"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No proposals produced (see logs)." >> "$GITHUB_STEP_SUMMARY"
          fi
