name: SBOM (CycloneDX + SPDX + Trivy)

# Calls the org-level reusable SBOM pipeline.
# Produces CycloneDX JSON + SPDX JSON via Anchore Syft and runs a Trivy
# filesystem scan. On tagged releases, both SBOMs are attached to the
# GitHub Release asset list.
#
# Pinned to .github commit f0961db0f44d8e53f956ccab14bdfa4a22e4e49b
# (2026-05-28) — update pin when reusable-sbom.yml changes.
#
# Series-A supply-chain compliance: CIS SSCS 2.4.4 / NTIA minimum elements.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read


jobs:
  sbom:
    name: SBOM
    uses: szl-holdings/.github/.github/workflows/reusable-sbom.yml@f0961db0f44d8e53f956ccab14bdfa4a22e4e49b
    with:
      attach-to-release: true
    permissions:
      contents: write
      security-events: write
