name: SBOM — CycloneDX via Syft

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

# Least privilege: read-only by default; the sbom job needs contents:write to
# upload release assets and id-token:write for attestation. (Scorecard Token-Permissions)
permissions: read-all
jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload-release-assets on release
      packages: read
      id-token: write   # SBOM attestation (OIDC)
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SBOM with Syft (CycloneDX)
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          output-file: sbom.cdx.json
          format: cyclonedx-json
          artifact-name: sbom.cdx.json
          upload-artifact: true
          upload-release-assets: true

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
