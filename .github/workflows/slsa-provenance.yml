name: SLSA provenance (L1 honest; L2 attested; L3 roadmap post-Warhacker)

# Generates a GitHub artifact attestation with SLSA v1 Build Level 2 provenance.
# The build, attestation, and release-write trust zones are separate jobs.
# No SLSA Build Level 3 claim is made.

on:
  workflow_dispatch:
  release:
    types: [created]

permissions: read-all

jobs:
  build:
    outputs:
      tarball: ${{ steps.package.outputs.tarball }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up elan (Lean toolchain manager)
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build with lake
        run: |
          set -euo pipefail
          if [[ -f lakefile.lean || -f lakefile.toml ]]; then
            lake build
          else
            echo "No lakefile - skipping lake build"
          fi

      - name: Package release tarball
        id: package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-dev}"
          TARBALL="lutar-lean-${VERSION}.tar.gz"
          TEMP_TARBALL="$RUNNER_TEMP/$TARBALL"
          tar -czf "$TEMP_TARBALL" --exclude='.git' --exclude='.lake/packages' .
          mv "$TEMP_TARBALL" "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Generate artifact hash
        run: |
          set -euo pipefail
          sha256sum "${{ steps.package.outputs.tarball }}"

      - name: Upload release tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarball
          path: ${{ steps.package.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  provenance:
    needs: [build]
    permissions:
      attestations: write
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Download release tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarball
          path: dist

      - name: Generate SLSA build provenance attestation
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/${{ needs.build.outputs.tarball }}

      - name: Preserve attestation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-bundle
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 7

  release-assets:
    if: github.event_name == 'release'
    needs: [build, provenance]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download release tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarball
          path: release-assets

      - name: Download attestation bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance-bundle
          path: release-assets

      - name: Attach tarball and provenance to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets found" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}"