name: Anchor verified snapshot into szl-lake

# Cryptographically anchor a kernel-verified proof-milestone snapshot from a GREEN
# build run into szl-holdings/szl-lake.
#
# Originally Theorem-U-specific; now generalized so ANY green proof milestone can
# be anchored on the same append-only Khipu chain by passing `kind` (+ optional
# artifact / predicate-type / source-workflow overrides). The default inputs
# reproduce the original Theorem-U anchor exactly.
#
# Flow (dispatch-only; you pass the run id of the verified build):
#   1. Re-confirm the source run is the expected build workflow AND conclusion
#      == success (gate: no anchoring of red/partial builds).
#   2. Download that run's snapshot artifact and assert it is a kernel-only
#      snapshot (kind-aware: theorem-u requires its headline decls + locked-five).
#   3. cosign attest-blob (keyless OIDC, DSSE in-toto) over the snapshot. No new
#      key is introduced -- this is the same keyless Sigstore mechanism as
#      cosign.yml. Verify the attestation in-CI before publishing.
#   4. Append a DSSE Khipu receipt to BOTH szl-lake surfaces (HF NDJSON canonical
#      + GitHub front-door lake_index.json), chain_index +1, idempotent.
#
# Honesty: the per-snapshot honesty block is carried verbatim into the receipt;
# each milestone states its own truthful status (proven / conditional / open) and
# is NEVER relabelled "proven" in bulk. For Theorem U specifically: REAL-conditional;
# Conjecture 1 (unconditional Lambda uniqueness) is OPEN and machine-checked FALSE.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of the GREEN build run that produced the snapshot artifact"
        required: true
        type: string
      kind:
        description: "Milestone kind id (default: theorem-u)"
        required: false
        type: string
        default: "theorem-u"
      source_workflow:
        description: "Expected name of the GREEN source run"
        required: false
        type: string
        default: "Lake build (gate + numbers)"
      artifact_prefix:
        description: "Snapshot artifact name prefix (artifact = <prefix>-<head_sha>)"
        required: false
        type: string
        default: "theorem-u-snapshot"
      snapshot_file:
        description: "Snapshot JSON filename inside the artifact"
        required: false
        type: string
        default: "theorem_u_snapshot.json"
      predicate_type:
        description: "cosign attestation predicate type"
        required: false
        type: string
        default: "https://szl-holdings/theorem-u-anchor/v1"

permissions: {}

concurrency:
  group: anchor-szl-lake
  cancel-in-progress: false

jobs:
  anchor:
    name: Anchor proof-milestone snapshot (cosign keyless -> szl-lake)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write   # keyless OIDC signing
      actions: read     # read source run + download its artifact
    env:
      KIND: ${{ github.event.inputs.kind }}
      SNAPSHOT_FILE: ${{ github.event.inputs.snapshot_file }}
      PREDICATE_TYPE: ${{ github.event.inputs.predicate_type }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout (scripts)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate source run is GREEN
        id: src
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run_id = Number('${{ github.event.inputs.run_id }}');
            const expected = '${{ github.event.inputs.source_workflow }}';
            const {owner, repo} = context.repo;
            const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id});
            core.info(`source run: ${run.name} #${run.id} status=${run.status} conclusion=${run.conclusion} sha=${run.head_sha} branch=${run.head_branch}`);
            if (run.name !== expected) {
              core.setFailed(`source run is '${run.name}', expected '${expected}'`);
              return;
            }
            if (run.status !== 'completed' || run.conclusion !== 'success') {
              core.setFailed(`source run not GREEN (status=${run.status} conclusion=${run.conclusion})`);
              return;
            }
            core.setOutput('head_sha', run.head_sha);
            core.setOutput('html_url', run.html_url);
            core.setOutput('name', run.name);

      - name: Download snapshot artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.event.inputs.artifact_prefix }}-${{ steps.src.outputs.head_sha }}
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ github.token }}
          path: .

      - name: Assert snapshot is a kernel-only proof-milestone snapshot
        run: |
          set -euo pipefail
          test -f "$SNAPSHOT_FILE" || { echo "::error::snapshot $SNAPSHOT_FILE missing"; exit 1; }
          python3 - <<'PY'
          import json, os, sys
          path = os.environ["SNAPSHOT_FILE"]
          kind = os.environ["KIND"]
          s = json.load(open(path))
          ms = s.get("milestone") or s.get("theorem_u") or {}
          if not ms.get("kernel_only"):
              print("::error::snapshot not kernel_only"); sys.exit(1)
          if not s.get("honesty"):
              print("::error::snapshot has no per-snapshot honesty block"); sys.exit(1)
          if kind == "theorem-u":
              need = {"TheoremU_LambdaUnique",
                      "CorollaryU1_LambdaUnique_Separable",
                      "CorollaryU2_LambdaUnique_Factors"}
              have = set(ms.get("headline_decls", []))
              missing = need - have
              if missing:
                  print(f"::error::theorem-u snapshot missing headline decls: {missing}"); sys.exit(1)
              if s.get("honesty", {}).get("locked_five_unchanged") is not True:
                  print("::error::snapshot honesty.locked_five_unchanged != true"); sys.exit(1)
          print(f"snapshot OK: kind={kind} commit={s.get('kernel_commit')} "
                f"status={ms.get('status')} decls={sorted(ms.get('headline_decls', []))}")
          PY

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign snapshot (cosign attest-blob, keyless DSSE)
        env:
          SOURCE_RUN_URL: ${{ steps.src.outputs.html_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          path = os.environ["SNAPSHOT_FILE"]
          s = json.load(open(path))
          ms = s.get("milestone") or s.get("theorem_u") or {}
          predicate = {
              "kind": s.get("kind", os.environ["KIND"]),
              "kernel_commit": s.get("kernel_commit"),
              "branch": s.get("branch"),
              "milestone": {
                  "id": ms.get("id"),
                  "title": ms.get("title"),
                  "status": ms.get("status"),
                  "headline_decls": ms.get("headline_decls"),
                  "headline_axiom_footprint": ms.get("headline_axiom_footprint"),
                  "kernel_only": ms.get("kernel_only"),
              },
              "lean_numbers": s.get("lean_numbers", {}).get("numbers"),
              "replay_hash": s.get("lean_numbers", {}).get("replay_hash"),
              "honesty": s.get("honesty"),
              "source_run_url": os.environ.get("SOURCE_RUN_URL", ""),
          }
          json.dump(predicate, open("snapshot_predicate.json", "w"), indent=2, sort_keys=True)
          PY
          cosign attest-blob --yes \
            --new-bundle-format \
            --predicate snapshot_predicate.json \
            --type "$PREDICATE_TYPE" \
            --bundle snapshot.cosign.bundle \
            "$SNAPSHOT_FILE"
          echo "bundle written:"; head -c 400 snapshot.cosign.bundle; echo

      - name: Verify attestation in-CI (keyless)
        run: |
          set -euo pipefail
          cosign verify-blob-attestation \
            --new-bundle-format \
            --bundle snapshot.cosign.bundle \
            --type "$PREDICATE_TYPE" \
            --certificate-identity-regexp "^https://github.com/szl-holdings/lutar-lean/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$SNAPSHOT_FILE"
          echo "cosign verify-blob-attestation OK"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install anchor deps
        run: python3 -m pip install --quiet huggingface_hub cryptography

      - name: Anchor into szl-lake (HF + GitHub front-door)
        env:
          SZL_LAKE_TOKEN: ${{ secrets.SZL_LAKE_TOKEN }}
          HF_LAKE_TOKEN: ${{ secrets.HF_LAKE_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/anchor_szl_lake.py \
            --snapshot "$SNAPSHOT_FILE" \
            --bundle snapshot.cosign.bundle \
            --predicate-type "$PREDICATE_TYPE" \
            --source-run-id "${{ github.event.inputs.run_id }}" \
            --source-run-url "${{ steps.src.outputs.html_url }}" \
            --source-workflow "${{ steps.src.outputs.name }}"
          echo "----- anchor_result.json -----"
          cat anchor_result.json || echo "(idempotent no-op: nothing newly anchored, no anchor_result.json)"

      # Positive confirmation to the shared a11oy-uptime ntfy topic so the team
      # SEES a new proof receipt land (mirrors verify-anchor-receipts.yml's
      # failure alert, but for the happy path). Fires ONLY when this run actually
      # appended a new receipt -- on an idempotent no-op the script returns before
      # writing anchor_result.json, so there is no file and no spurious ping.
      # SLACK_WEBHOOK_URL points at the org's ntfy relay; soft-skip with a warning
      # if it is unset (the anchor + floor bump still landed). Honesty: the
      # per-snapshot status is carried verbatim, never inflated to a blanket
      # "proven" (Theorem U is REAL-conditional; Conjecture 1 is OPEN / FALSE).
      - name: Confirm new anchor to the team (a11oy-uptime ntfy)
        if: ${{ success() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ ! -f anchor_result.json ]; then
            echo "::notice::No anchor_result.json (idempotent no-op / nothing newly anchored) — no team confirmation sent."
            exit 0
          fi
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "::warning::SLACK_WEBHOOK_URL secret not configured — skipping the team confirmation. The anchor + verify-anchor-receipts floor bump still landed; see anchor_result.json."
            exit 0
          fi
          text=$(python3 - <<'PY'
          import json
          r = json.load(open("anchor_result.json"))
          import os
          run_url = os.environ.get("RUN_URL", "")
          bumped = r.get("baseline_bumped")
          floor = r.get("baseline_min_receipts")
          floor_line = (f"verify-anchor-receipts floor auto-raised to min_receipts={floor}"
                        if bumped else f"verify-anchor-receipts floor unchanged (min_receipts={floor})")
          lines = [
              f":white_check_mark: *New szl-lake proof anchor landed* — kind `{r.get('kind')}` "
              f"chain_index {r.get('chain_index')} in szl-holdings/szl-lake.",
              f"*Milestone:* {r.get('milestone_title')} — status {r.get('milestone_status') or 'n/a'}",
              f"*Honesty:* {r.get('honesty_note')}",
              f"*Floor:* {floor_line}",
              f"*Receipt:* {r.get('receipt_id')}",
              f"*Rekor log index:* {r.get('rekor_log_index')}",
              f"*Commit:* {r.get('github_commit')}",
              f"*Anchor run:* {run_url}",
          ]
          print("\n".join(lines))
          PY
          )
          payload=$(jq -n --arg text "$text" '{text: $text}')
          echo "Posting new-anchor confirmation to webhook..."
          code=$(curl -sS -o /tmp/confirm_resp.txt -w '%{http_code}' \
                   -X POST -H 'Content-Type: application/json' \
                   --max-time 20 --data "${payload}" "${SLACK_WEBHOOK_URL}")
          echo "Webhook responded HTTP ${code}."
          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "::error::New-anchor confirmation webhook POST failed (HTTP ${code}): $(cat /tmp/confirm_resp.txt)"
            exit 1
          fi
          echo "New-anchor confirmation delivered."

      - name: Upload anchor receipt + bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event.inputs.kind }}-anchor-${{ steps.src.outputs.head_sha }}
          path: |
            ${{ github.event.inputs.snapshot_file }}
            snapshot_predicate.json
            snapshot.cosign.bundle
            anchor_result.json
          if-no-files-found: warn
