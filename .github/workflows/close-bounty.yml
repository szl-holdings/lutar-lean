# SPDX-License-Identifier: Apache-2.0
# SZL Holdings — Open-Problem Bounty Board · Doctrine v11
#
# Auto-closes a bounty board entry the moment its proof is *accepted* by the
# no-bypass arbiter, so the public board never shows a stale "OPEN" on a solved
# problem. It NEVER decides eligibility itself — it only reacts to a green arbiter:
#
#   * Conjecture 1 (Lambda uniqueness): szl-holdings/lambda-bounty's verify-proof
#     CI, on a green proof landing on its main, fires a repository_dispatch
#     (event_type: bounty-solved) into this repo with the solver + proof commit.
#   * Conjecture 2 (Khipu BFT safety): this repo's own "Lean kernel check"
#     (lean.yml) — on a green run on main where the target theorem
#     ubuntu_quorum_safety is actually discharged (no sorry) — is observed via
#     workflow_run and closes Conjecture 2.
#   * workflow_dispatch: a manual founder fallback with explicit inputs.
#
# The close is proposed as a SIGNED commit on a branch + a PR (createCommitOnBranch
# produces a GitHub-verified commit, satisfying main's signed-commit protection);
# the founder merges. check_bounties.py runs first and refuses a half-filled close.
#
# REHEARSAL MODE (workflow_dispatch, rehearse=true):
#   Because both real conjectures are genuinely OPEN, the happy path can't be tested
#   on real data without faking a proof — which the honesty doctrine forbids. So a
#   founder can run this workflow with `rehearse: true` to drill the WHOLE pipeline
#   (stage fixture -> edit -> validate -> signed PR) against a throwaway fixture
#   bounty (`rehearsal-do-not-merge`, from tests/fixtures/rehearsal_bounty.yaml).
#   It NEVER touches a real OPEN bounty and NEVER claims a real solve; the fixture
#   is committed only to a disposable auto/close-* branch. The run asserts the PR
#   opened with a correctly-edited entry, then cleans up after itself (closes the
#   test PR and deletes the branch).
name: Close Bounty

on:
  repository_dispatch:
    types: [bounty-solved]
  workflow_run:
    workflows: ["Lean kernel check"]
    types: [completed]
  workflow_dispatch:
    inputs:
      rehearse:
        description: "REHEARSAL drill: exercise the pipeline end to end against a throwaway fixture (never closes a real bounty)"
        type: boolean
        required: false
        default: false
      bounty_id:
        description: "Bounty id (== YAML filename stem). Required unless rehearse=true."
        required: false
        default: ""
      solver:
        description: "Solver GitHub handle / name. Required unless rehearse=true."
        required: false
        default: ""
      proof_commit:
        description: "Accepted proof commit SHA. Required unless rehearse=true."
        required: false
        default: ""
      proof_repo:
        description: "szl-holdings/<repo> the proof landed in"
        required: false
        default: ""
      verify_run:
        description: "URL of the green arbiter CI run"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: close-bounty
  cancel-in-progress: false

jobs:
  close:
    name: Propose bounty close
    runs-on: ubuntu-latest
    # For the workflow_run trigger only act on a GREEN run that built main; the
    # other triggers always proceed (the dispatcher already gated eligibility).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # For workflow_run, check out the exact verified commit; otherwise the
          # default ref (main HEAD) is used.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install --no-cache-dir pyyaml

      - name: Resolve close parameters
        id: params
        env:
          EVENT: ${{ github.event_name }}
          # rehearsal toggle (workflow_dispatch only; typed boolean -> "true"/"false")
          REHEARSE: ${{ inputs.rehearse }}
          # repository_dispatch payload (Conjecture 1, from lambda-bounty)
          RD_BOUNTY: ${{ github.event.client_payload.bounty_id }}
          RD_SOLVER: ${{ github.event.client_payload.solver }}
          RD_COMMIT: ${{ github.event.client_payload.proof_commit }}
          RD_REPO: ${{ github.event.client_payload.proof_repo }}
          RD_RUN: ${{ github.event.client_payload.verify_run }}
          # workflow_dispatch inputs (manual founder fallback)
          WD_BOUNTY: ${{ github.event.inputs.bounty_id }}
          WD_SOLVER: ${{ github.event.inputs.solver }}
          WD_COMMIT: ${{ github.event.inputs.proof_commit }}
          WD_REPO: ${{ github.event.inputs.proof_repo }}
          WD_RUN: ${{ github.event.inputs.verify_run }}
          # workflow_run context (Conjecture 2, this repo's kernel check)
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_ACTOR: ${{ github.event.workflow_run.head_commit.author.name }}
          WR_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          ACT=true
          REHEARSE="${REHEARSE:-false}"
          case "$EVENT" in
            repository_dispatch)
              BOUNTY="$RD_BOUNTY"; SOLVER="$RD_SOLVER"; COMMIT="$RD_COMMIT"
              REPO="$RD_REPO"; RUN="$RD_RUN"
              ;;
            workflow_dispatch)
              if [ "$REHEARSE" = "true" ]; then
                # Throwaway fixture values — clearly never a real solve.
                BOUNTY="rehearsal-do-not-merge"
                SOLVER="rehearsal-bot (NOT A REAL SOLVE)"
                COMMIT="0000000000"
                REPO="szl-holdings/lutar-lean"
                RUN="https://example.invalid/rehearsal-${GITHUB_RUN_ID}"
              else
                BOUNTY="$WD_BOUNTY"; SOLVER="$WD_SOLVER"; COMMIT="$WD_COMMIT"
                REPO="$WD_REPO"; RUN="$WD_RUN"
              fi
              ;;
            workflow_run)
              # Conjecture 2: the green kernel check proves the whole library
              # builds; here we additionally require zero (non-comment) sorry in
              # the target obligation file before declaring it discharged.
              BOUNTY="conjecture-2-khipu-bft-safety"
              TARGET="Lutar/Innovations/round12/Identity_Ayni_Quorum.lean"
              if [ ! -f "$TARGET" ]; then
                echo "::notice::target file $TARGET absent — nothing to close."
                ACT=false
              elif grep -REn '(^|[^A-Za-z_])sorry([^A-Za-z_]|$)' "$TARGET" | grep -vqE '^[0-9]+:[[:space:]]*--'; then
                echo "::notice::Conjecture 2 still OPEN — sorry remains in $TARGET."
                ACT=false
              fi
              SOLVER="${WR_ACTOR:-unknown}"; COMMIT="$WR_SHA"
              REPO="${GITHUB_REPOSITORY}"; RUN="$WR_RUN_URL"
              ;;
            *)
              echo "::error::unsupported event $EVENT"; exit 1 ;;
          esac

          if [ "$ACT" = "true" ]; then
            : "${BOUNTY:?bounty_id required}"
            : "${SOLVER:?solver required}"
            : "${COMMIT:?proof_commit required}"
          fi
          {
            echo "act=$ACT"
            echo "rehearse=$REHEARSE"
            echo "bounty=$BOUNTY"
            echo "solver=$SOLVER"
            echo "commit=$COMMIT"
            echo "repo=$REPO"
            echo "run=$RUN"
          } >> "$GITHUB_OUTPUT"

      - name: Stage rehearsal fixture
        if: steps.params.outputs.act == 'true' && steps.params.outputs.rehearse == 'true'
        run: |
          set -euo pipefail
          SRC="tests/fixtures/rehearsal_bounty.yaml"
          DST="bounties/rehearsal-do-not-merge.yaml"
          [ -f "$SRC" ] || { echo "::error::rehearsal fixture $SRC missing"; exit 1; }
          cp "$SRC" "$DST"
          echo "::notice::Staged throwaway rehearsal fixture into $DST (never merged to main)."

      - name: Edit board entry
        if: steps.params.outputs.act == 'true'
        env:
          BOUNTY: ${{ steps.params.outputs.bounty }}
          SOLVER: ${{ steps.params.outputs.solver }}
          COMMIT: ${{ steps.params.outputs.commit }}
          PROOF_REPO: ${{ steps.params.outputs.repo }}
          RUN_URL: ${{ steps.params.outputs.run }}
        run: |
          set -euo pipefail
          ARGS=(--bounty-id "$BOUNTY" --solver "$SOLVER" --proof-commit "$COMMIT")
          [ -n "$PROOF_REPO" ] && ARGS+=(--proof-repo "$PROOF_REPO")
          [ -n "$RUN_URL" ] && ARGS+=(--verify-run "$RUN_URL")
          python3 scripts/close_bounty.py "${ARGS[@]}"

      - name: Validate board (no-bypass gate)
        if: steps.params.outputs.act == 'true'
        run: python3 scripts/check_bounties.py

      - name: Open signed PR with the close
        id: openpr
        if: steps.params.outputs.act == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional PAT (a real user/org token) used ONLY to open the PR. This org
          # forbids the Actions GITHUB_TOKEN from creating PRs (deliberate lockdown),
          # so without this secret the workflow falls back to pushing the signed
          # branch + surfacing a one-click compare URL for a human to open the PR.
          PR_TOKEN: ${{ secrets.BOUNTY_BOARD_TOKEN }}
          REHEARSE: ${{ steps.params.outputs.rehearse }}
          BOUNTY: ${{ steps.params.outputs.bounty }}
          SOLVER: ${{ steps.params.outputs.solver }}
          COMMIT: ${{ steps.params.outputs.commit }}
          PROOF_REPO: ${{ steps.params.outputs.repo }}
          RUN_URL: ${{ steps.params.outputs.run }}
        run: |
          set -euo pipefail
          FILE="bounties/${BOUNTY}.yaml"
          [ -f "$FILE" ] || FILE="bounties/${BOUNTY}.yml"
          BRANCH="auto/close-${BOUNTY}"
          BASE_OID="$(git rev-parse HEAD)"
          CMP_URL="https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"

          # Don't duplicate an already-open PR for this branch.
          OPEN_COUNT="$(gh pr list --head "$BRANCH" --state open --json number --jq 'length' 2>/dev/null || echo 0)"
          if [ "$OPEN_COUNT" != "0" ]; then
            echo "::notice::A PR for $BRANCH is already open — skipping."
            echo "pr_opened=true" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Reset the branch ref to the current base (delete-if-exists, then create).
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" >/dev/null 2>&1 || true
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/${BRANCH}" -f sha="${BASE_OID}" >/dev/null

          if [ "${REHEARSE:-false}" = "true" ]; then
            COMMIT_MSG="REHEARSAL (do not merge): drill close of ${BOUNTY} — pipeline test, not a real solve"
            PR_TITLE="[REHEARSAL · DO NOT MERGE] board: drill close of ${BOUNTY}"
          else
            COMMIT_MSG="board: close ${BOUNTY} — proof accepted (solver ${SOLVER})"
            PR_TITLE="board: close ${BOUNTY} — proof accepted"
          fi

          # Signed commit via createCommitOnBranch (GitHub verifies the commit; the
          # Actions GITHUB_TOKEN is allowed to push to an unprotected auto/* branch).
          CONTENT_B64="$(base64 -w0 "$FILE")"
          gh api graphql \
            -f query='mutation($repo:String!,$branch:String!,$oid:GitObjectID!,$path:String!,$content:Base64String!,$msg:String!){createCommitOnBranch(input:{branch:{repositoryNameWithOwner:$repo,branchName:$branch},expectedHeadOid:$oid,message:{headline:$msg},fileChanges:{additions:[{path:$path,contents:$content}]}}){commit{url}}}' \
            -f repo="${GITHUB_REPOSITORY}" \
            -f branch="${BRANCH}" \
            -f oid="${BASE_OID}" \
            -f path="${FILE}" \
            -f content="${CONTENT_B64}" \
            -f msg="${COMMIT_MSG}" >/dev/null

          # PR body (written to a file to avoid heredoc indentation pitfalls).
          {
            if [ "${REHEARSE:-false}" = "true" ]; then
              printf '> **REHEARSAL — DO NOT MERGE.** This PR is an automated pipeline drill against a throwaway fixture (`%s`). It does NOT close a real bounty and claims NO real solve. The workflow closes this PR and deletes its branch automatically.\n\n' "$BOUNTY"
            fi
            printf 'Auto-generated by the bounty auto-close pipeline: the proof arbiter accepted a proof for **%s**.\n\n' "$BOUNTY"
            printf -- '- **Solver:** %s\n' "$SOLVER"
            printf -- '- **Proof commit:** `%s`\n' "$COMMIT"
            printf -- '- **Proof repo:** %s\n' "${PROOF_REPO:-(this repo)}"
            printf -- '- **Arbiter run:** %s\n\n' "${RUN_URL:-n/a}"
            printf 'This flips `status` to `CLOSED` and records the `solved` provenance block. '
            printf '`check_bounties.py` has already validated the closed state. '
            printf 'Founder: please review the honesty prose (summary / honesty notes still describe the OPEN framing) before or at merge.\n'
          } > /tmp/pr-body.md

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if [ -n "${PR_TOKEN:-}" ]; then
            # A PAT is provisioned — open the PR for real.
            GH_TOKEN="$PR_TOKEN" gh pr create --base main --head "$BRANCH" \
              --title "$PR_TITLE" \
              --body-file /tmp/pr-body.md
            echo "::notice::Opened PR on ${BRANCH}."
            echo "pr_opened=true" >> "$GITHUB_OUTPUT"
          else
            # Org policy blocks Actions from opening PRs. Push the signed branch and
            # FAIL-LOUD with a one-click compare URL (never silently mask).
            echo "pr_opened=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Actions cannot open PRs in this org (GITHUB_TOKEN is blocked). The signed close commit is pushed to '${BRANCH}'. Open the PR here: ${CMP_URL}"
            {
              echo "### Bounty auto-close — open the PR manually"
              echo ""
              echo "Actions is not permitted to open PRs in this org, so the signed close commit was pushed to \`${BRANCH}\` and the PR was **not** auto-created."
              echo ""
              echo "**One-click open:** ${CMP_URL}"
              echo ""
              echo "_To make the PR open automatically, provision a \`BOUNTY_BOARD_TOKEN\` repo secret (a PAT with contents+pull-requests write on this repo)._"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify rehearsal outcome
        if: steps.params.outputs.act == 'true' && steps.params.outputs.rehearse == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BOUNTY: ${{ steps.params.outputs.bounty }}
          PR_OPENED: ${{ steps.openpr.outputs.pr_opened }}
        run: |
          set -euo pipefail
          FILE="bounties/${BOUNTY}.yaml"
          BRANCH="auto/close-${BOUNTY}"
          # 1. the local edit really flipped the entry
          grep -qE '^status:[[:space:]]*CLOSED' "$FILE" || { echo "::error::fixture not CLOSED"; exit 1; }
          grep -qE '^solved:' "$FILE" || { echo "::error::fixture missing solved block"; exit 1; }
          # 2. the signed close commit really landed on the auto/close-* branch
          gh api "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" >/dev/null \
            || { echo "::error::rehearsal FAILED — branch $BRANCH was not created"; exit 1; }
          # 3. the PR really opened (when a PAT is provisioned)
          if [ "${PR_OPENED:-false}" = "true" ]; then
            COUNT="$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')"
            [ "${COUNT}" -ge 1 ] || { echo "::error::rehearsal FAILED — pr_opened=true but no open PR on $BRANCH"; exit 1; }
            NUM="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
            echo "::notice::Rehearsal PASS — PR #${NUM} opened on ${BRANCH} with a CLOSED fixture entry."
          else
            echo "::notice::Rehearsal PASS (no-PAT path) — signed CLOSED commit on ${BRANCH}; PR-open step surfaced a compare URL (org blocks Actions PRs). Provision BOUNTY_BOARD_TOKEN to auto-open."
          fi

      - name: Clean up rehearsal
        if: ${{ always() && steps.params.outputs.rehearse == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BOUNTY: ${{ steps.params.outputs.bounty }}
        run: |
          set -uo pipefail
          BRANCH="auto/close-${BOUNTY}"
          # Close the throwaway PR (if any) and delete its branch — no trace left.
          gh pr close "$BRANCH" --comment "Rehearsal complete — closing throwaway drill PR." --delete-branch >/dev/null 2>&1 || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" >/dev/null 2>&1 || true
          echo "::notice::Rehearsal cleanup done — PR closed and ${BRANCH} deleted."
