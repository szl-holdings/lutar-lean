name: Trivy + Grype container vulnerability scan

# NOTE: No CVE suppressions (.trivyignore/.grype.yaml) are needed as of 2026-06-04:
# Grype finds 0 HIGH/CRITICAL vulnerabilities in the filesystem scan.
# If future CVEs are added, create a .grype.yaml with per-CVE justifications
# (only upstream-unfixable; never hide fixable CVEs).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC

# Least privilege: read-only at the top level; each scanning job that uploads
# SARIF to the Security tab declares security-events:write. (Scorecard Token-Permissions)
permissions:
  contents: read

jobs:
  trivy-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload-sarif to Security tab
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Trivy vulnerability scan (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'  # Don't fail on scan (gate in grype job)

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  grype-gate:
    name: Grype CVE gate (fail on HIGH/CRITICAL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload-sarif to Security tab
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Scan with Grype (fail build on HIGH/CRITICAL)
        id: grype-scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          path: "."
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      - name: Upload Grype SARIF
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        if: always()
        # anchore/scan-action only generates results.sarif when findings exist.
        # When 0 findings, the file may not be created — guard with a check.
        continue-on-error: true
        with:
          sarif_file: results.sarif
