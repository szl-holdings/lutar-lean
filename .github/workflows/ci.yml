name: CI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
  merge_group:
    types:
    - checks_requested
    branches:
    - main
permissions:
  contents: read

# Placeholder context, not a check: this job runs nothing. It keeps the
# historical "CI checks" status context alive for branch protection. The real
# gates are Tests (tests.yml), Lake build (gate + numbers), Lean kernel check,
# sorry-gate and the guards beside them; the README badge points at Tests.
jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder context (no checks run here)
        run: echo "Placeholder only - see Tests, Lake build and Lean kernel check for the real results."
