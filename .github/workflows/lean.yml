name: Lean kernel check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show Lean version (from lean-toolchain)
        run: |
          lean --version
          lake --version

      - name: Lake update (generate lake-manifest.json)
        run: lake update

      - name: Build (kernel-check the whole library)
        run: lake build

      - name: Count remaining sorrys
        run: |
          echo "## Remaining \`sorry\` axioms" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          COUNT=$(grep -rn '^[^-]*\bsorry\b' Lutar/*.lean Main.lean 2>/dev/null | grep -v '^--' | wc -l || echo "0")
          echo "Total \`sorry\` markers: **$COUNT**" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          grep -rn '\bsorry\b' Lutar/*.lean Main.lean 2>/dev/null | grep -v '^--' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Run check executable
        run: lake exe check

      - name: Run reference-vectors parity check
        run: lake exe ref_vectors reference-vectors.json
