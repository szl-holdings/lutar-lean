name: Lean kernel check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The repo doesn't commit lake-manifest.json (per .gitignore best practice).
      # Install elan first so we can run `lake update` to generate the manifest
      # before lean-action's configure step (which requires it).
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Resolve toolchain from lean-toolchain
        run: |
          # elan auto-installs the toolchain pinned in ./lean-toolchain on first lake use
          lake --version

      - name: Generate lake-manifest.json (lake update)
        run: lake update -R

      - name: Install Lean + Mathlib cache via lean-action
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true

      - name: Build (kernel-check the whole library)
        run: lake build

      - name: Count remaining sorrys
        run: |
          echo "## Remaining \`sorry\` axioms" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          COUNT=$(grep -rn '^[^-]*\bsorry\b' Lutar/*.lean Main.lean 2>/dev/null | grep -v '^--' | wc -l || echo "0")
          echo "Total \`sorry\` markers: **$COUNT**" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          grep -rn '\bsorry\b' Lutar/*.lean Main.lean 2>/dev/null | grep -v '^--' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Run check executable
        run: lake exe check

      - name: Run reference-vectors parity check
        run: lake exe ref_vectors reference-vectors.json
