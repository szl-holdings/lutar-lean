version: 2
updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "security"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  # pip and docker ecosystems removed 2026-06-23: no Dockerfile or pip manifest
  # exists at "/" so Dependabot updater errored (update runs #1428697021 and
  # #1428700310). Re-add if a Dockerfile or requirements.txt is introduced.
