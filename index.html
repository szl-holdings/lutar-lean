<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>lutar-lean — live theorem graph (749/14/163)</title>
<meta name="description" content="749 Lean declarations as nodes, import edges as links. 14 axioms glow gold, 163 tracked sorries pulse purple."/>
<style>
 :root{--bg:#070912;--fg:#e8ecf6;--accent:#5ad1ff;--gold:#7CFFB2;--purple:#8b7bff;--dim:#5b6478;}
 html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'Inter',system-ui,sans-serif;overflow:hidden;}
 #c{position:fixed;inset:0;display:block;}
 .hud{position:fixed;left:18px;top:16px;z-index:5;pointer-events:none;}
 .hud h1{font-size:15px;font-weight:600;letter-spacing:.12em;margin:0;text-transform:uppercase;}
 .hud p{margin:4px 0 0;font-size:12px;color:var(--dim);font-family:'JetBrains Mono',monospace;}
 .legend{position:fixed;right:16px;bottom:14px;z-index:5;font-size:11px;color:var(--dim);font-family:'JetBrains Mono',monospace;text-align:right;line-height:1.8;}
 .legend b{color:var(--accent);}.legend .g{color:var(--gold);}.legend .p{color:var(--purple);}
 .tip{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:5;font-size:11px;color:var(--dim);font-family:'JetBrains Mono',monospace;}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud"><h1>lutar-lean theorem graph</h1><p>lake build clean @ main · doctrine v11 LOCKED</p></div>
<div class="legend">
 <div><b>749</b> declarations (cyan)</div>
 <div><span class="g">14</span> unique axioms (green)</div>
 <div><span class="p">163</span> tracked sorries (purple)</div>
</div>
<div class="tip">drag to orbit · scroll to zoom · proof DAG, deterministic layout</div>
<script type="importmap">{ "imports": {
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" }}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const DECL=749, AX=14, SORRY=163;
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(0x070912,0.0085);
const camera=new THREE.PerspectiveCamera(60,1,0.1,600); camera.position.set(0,0,150);
const controls=new OrbitControls(camera,canvas); controls.enableDamping=true;
controls.autoRotate=true; controls.autoRotateSpeed=0.5; controls.minDistance=40; controls.maxDistance=320;
// deterministic pseudo-random (mulberry32)
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const r=rng(74914);
// place 749 nodes in a 3D shell cluster
const pts=[]; const R=70;
for(let i=0;i<DECL;i++){ const u=r(),v=r(); const th=u*Math.PI*2, ph=Math.acos(2*v-1);
 const rad=R*(0.45+0.55*r()); pts.push(new THREE.Vector3(rad*Math.sin(ph)*Math.cos(th),rad*Math.sin(ph)*Math.sin(th),rad*Math.cos(ph))); }
// node colors: first 14 = axioms(gold); a deterministic 163 = sorries(purple); rest cyan
const col=new Float32Array(DECL*3); const sz=new Float32Array(DECL);
const cCyan=new THREE.Color(0x5ad1ff), cGold=new THREE.Color(0x7CFFB2), cPur=new THREE.Color(0x8b7bff);
let sorrySet=new Set(); { let c=0,step=Math.floor(DECL/SORRY); for(let i=0;i<DECL&&c<SORRY;i+=step){sorrySet.add(i);c++;} }
const posArr=new Float32Array(DECL*3);
for(let i=0;i<DECL;i++){ posArr[i*3]=pts[i].x;posArr[i*3+1]=pts[i].y;posArr[i*3+2]=pts[i].z;
 let c=cCyan,s=1.1; if(i<AX){c=cGold;s=2.6;} else if(sorrySet.has(i)){c=cPur;s=1.6;}
 col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b; sz[i]=s; }
const g=new THREE.BufferGeometry();
g.setAttribute('position',new THREE.BufferAttribute(posArr,3));
g.setAttribute('color',new THREE.BufferAttribute(col,3));
g.setAttribute('asize',new THREE.BufferAttribute(sz,1));
const mat=new THREE.PointsMaterial({size:2.4,vertexColors:true,sizeAttenuation:true});
const cloud=new THREE.Points(g,mat); scene.add(cloud);
// edges: each node links to a lower-index "import" (proof DAG), ~1200 edges
const ept=[]; for(let i=AX;i<DECL;i++){ const deg=1+(Math.floor(r()*2)); for(let k=0;k<deg;k++){ const j=Math.floor(r()*i); ept.push(pts[i],pts[j]); } }
const eg=new THREE.BufferGeometry().setFromPoints(ept);
scene.add(new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0x223a5e,transparent:true,opacity:0.22})));
// glow sprites for axioms
const axGroup=new THREE.Group();
for(let i=0;i<AX;i++){ const s=new THREE.Mesh(new THREE.SphereGeometry(2.0,16,16),new THREE.MeshBasicMaterial({color:0x7CFFB2,transparent:true,opacity:0.16})); s.position.copy(pts[i]); axGroup.add(s);} scene.add(axGroup);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();
 cloud.rotation.y=t*0.02; axGroup.children.forEach((s,i)=>s.scale.setScalar(1+0.25*Math.sin(t*2+i)));
 controls.update(); renderer.render(scene,camera);}
animate();
</script></body></html>
